version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
  settings:
    gosec:
      excludes:
        # web_api_key is a config-key *name*, not a credential value (false positive).
        - G101
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # ST1005: this tool's errors routinely start with proper nouns ("Zotero",
      # "Open Library"), the documented exception to the lowercase-error rule.
      - linters:
          - staticcheck
        text: 'ST1005:'
      # gosec targets the production security surface; test files legitimately
      # write 0644 temp fixtures and mock taint-y HTTP responses (G306/G705
      # false positives), so scope gosec out of tests.
      - linters:
          - gosec
        path: '_test\.go'
      # G202: internal/job builds every statement from literals. The only
      # dynamic fragment in the file is a "?," placeholder run sized to a
      # []int64 argument list; the ids themselves travel as bound parameters,
      # so no caller data can reach the SQL text. A newer gosec started
      # flagging the one occurrence written inline in the Exec call. G202
      # stays armed everywhere else.
      - linters:
          - gosec
        text: 'G202:'
        path: 'internal/job/job\.go'
    paths:
      - third_party$
      - builtin$
      - examples$
      - extension/node_modules/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - extension/node_modules/
