<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>papio — inbox</title>
    <style>
      :root {
        color-scheme: light dark;
        --color-ink: #182231;
        --color-brand-ink: #2b2d42;
        --color-brand-accent: #d94f3d;
        --color-muted: #607080;
        --color-context: #426789;
        --color-border: #dce3ea;
        --color-control-border: #b8c5d1;
        --color-page: #f4f7f9;
        --color-surface: #fdfefe;
        --color-surface-hover: #eef3f6;
        --color-primary: #12549b;
        --color-primary-border: #8db9eb;
        --color-primary-surface: #eaf3ff;
        --color-primary-hover: #dcecff;
        --color-warning: #6d4316;
        --color-warning-border: #a15c17;
        --color-warning-surface: #fff7ed;
        --color-ok: #245e45;
        --color-ok-border: #78aa8f;
        --color-ok-surface: #edf7f1;
        --color-primary-solid: #12549b;
        --color-primary-solid-hover: #0d447f;
        --color-on-primary: #fdfefe;
        --color-danger: #8f2f28;
        --color-danger-border: #d94f3d;
        --color-danger-surface: #fff0ed;
        --color-neutral-badge: #eef3f6;
        --color-overlay: rgb(24 34 49 / 56%);
        --shadow-dialog: 0 24px 64px rgb(24 34 49 / 20%);
        --font-size-label: 11px;
        --font-size-small: 12px;
        --font-size-body: 14px;
        --font-size-title: 22px;
        --font-size-item-title: 16px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --space-12: 48px;
        --radius-control: 6px;
        --radius-card: 8px;
        --control-height: 36px;
        --brand-mark-size: 32px;
        --focus-width: 2px;
        --focus-offset: 2px;
        --page-max-width: 72rem;
        --dialog-max-width: 32rem;
        --content-measure: 60rem;
        --radius-pill: 999px;
        --motion-hover: 120ms;
        --motion-state: 160ms;
        --motion-feedback-in: 180ms;
        --motion-feedback-out: 140ms;
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --ease-in-quart: cubic-bezier(0.5, 0, 0.75, 0);
        --row-control-size: 32px;
        --shadow-feedback: 0 8px 24px rgb(24 34 49 / 16%);
        accent-color: var(--color-primary);
        color: var(--color-ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-ink: #e5edf4;
          --color-brand-ink: #f0edf3;
          --color-brand-accent: #ef6a57;
          --color-muted: #a2b1be;
          --color-context: #aecbe4;
          --color-border: #3e4f61;
          --color-control-border: #526579;
          --color-page: #141b23;
          --color-surface: #1c2631;
          --color-surface-hover: #263340;
          --color-primary: #a8d0ff;
          --color-primary-border: #4f85bc;
          --color-primary-surface: #183956;
          --color-primary-hover: #214967;
          --color-warning: #f1c183;
          --color-warning-border: #b97833;
          --color-warning-surface: #33291e;
          --color-ok: #b3ddc2;
          --color-ok-border: #568f6d;
          --color-ok-surface: #1d3329;
          --color-primary-solid: #75b5f5;
          --color-primary-solid-hover: #91c5fb;
          --color-on-primary: #101a24;
          --color-danger: #ffb2a8;
          --color-danger-border: #ef6a57;
          --color-danger-surface: #3a2223;
          --color-neutral-badge: #263340;
          --color-overlay: rgb(4 9 15 / 72%);
          --shadow-dialog: 0 24px 64px rgb(4 9 15 / 52%);
          --shadow-feedback: 0 8px 24px rgb(4 9 15 / 40%);
        }
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        min-height: 100%;
      }

      body {
        background: var(--color-page);
        color: var(--color-ink);
        font-size: var(--font-size-body);
        line-height: 1.5;
        margin: 0 auto;
        max-width: var(--page-max-width);
        min-height: 100vh;
        padding: var(--space-8) var(--space-6) 0;
      }
      body {
        overflow-x: hidden;
      }

      header {
        border-bottom: 1px solid var(--color-border);
        display: grid;
        gap: var(--space-3);
        grid-template-columns: minmax(0, 1fr) auto;
        padding-bottom: var(--space-4);
      }

      .brand {
        grid-column: 1;
        grid-row: 1;
      }

      #connection-status {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
      }

      h1,
      h2,
      h3,
      p,
      dl {
        margin: 0;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: var(--space-3);
        margin-bottom: var(--space-1);
      }

      .brand svg {
        flex: 0 0 auto;
        height: var(--brand-mark-size);
        width: var(--brand-mark-size);
      }

      .brand-name {
        color: var(--color-brand-ink);
        font-size: var(--font-size-title);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      .brand-name em {
        text-decoration-color: var(--color-brand-accent);
        text-decoration-line: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: var(--space-1);
      }

      .page-name {
        color: var(--color-muted);
        font-weight: 500;
      }

      #connection-status {
        align-items: center;
        color: var(--color-muted);
        display: flex;
        font-size: var(--font-size-small);
        gap: var(--space-2);
      }

      #connection-status::before {
        background: var(--color-control-border);
        border-radius: 50%;
        content: "";
        flex: 0 0 auto;
        height: 8px;
        width: 8px;
      }

      #connection-status[data-state="connected"] {
        color: var(--color-ok);
      }

      #connection-status[data-state="connected"]::before {
        background: var(--color-ok-border);
      }

      #connection-status[data-state="disconnected"] {
        background: var(--color-warning-surface);
        border: 1px solid var(--color-warning-border);
        border-radius: var(--radius-control);
        color: var(--color-warning);
        font-weight: 600;
        padding: var(--space-2) var(--space-3);
      }

      #connection-status[data-state="disconnected"]::before {
        background: var(--color-warning-border);
      }

      #inbox-pulse {
        align-self: center;
        color: var(--color-ink);
        font-size: var(--font-size-small);
        font-variant-numeric: tabular-nums;
        grid-column: 1;
        grid-row: 2;
      }

      #inbox-counts {
        align-self: center;
        color: var(--color-muted);
        font-size: var(--font-size-small);
        font-variant-numeric: tabular-nums;
        grid-column: 1;
        grid-row: 3;
      }

      .toolbar {
        flex-wrap: nowrap;
        grid-column: 2;
        grid-row: 3;
        justify-content: flex-end;
      }

      .toolbar,
      .item-controls {
        align-items: center;
        display: flex;
        gap: var(--space-2);
      }

      .item-controls {
        flex-wrap: wrap;
      }

      #citation-style {
        background: var(--color-surface);
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        font: inherit;
        font-size: var(--font-size-small);
        min-height: var(--control-height);
        padding: var(--space-1) var(--space-2);
      }

      #item-filter {
        appearance: none;
        background: var(--color-surface);
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        flex: 1 1 12rem;
        font: inherit;
        font-size: var(--font-size-small);
        min-height: var(--control-height);
        min-width: 0;
        padding: var(--space-1) var(--space-3);
      }

      #item-filter::placeholder {
        color: var(--color-muted);
      }

      #shortcut-help strong {
        color: var(--color-context);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      button {
        appearance: none;
        background: var(--color-surface);
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        cursor: pointer;
        font: inherit;
        font-size: var(--font-size-small);
        min-height: var(--control-height);
        padding: var(--space-1) var(--space-3);
        transition:
          background-color var(--motion-hover),
          border-color var(--motion-hover),
          color var(--motion-hover);
      }

      button:hover:not(:disabled) {
        background: var(--color-surface-hover);
      }

      button:focus-visible,
      a:focus-visible,
      #item-filter:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      [data-operation="acquire"],
      [data-operation="accept"]:not(:disabled),
      .triage-item .item-controls:not(:has([data-operation="accept"], [data-operation="acquire"], [data-operation="preview"])) [data-operation="open"]:not(:disabled),
      #confirm-submit,
      .item-controls:has([data-operation="accept"]:disabled) [data-operation="preview"]:not(:disabled) {
        background: var(--color-primary-solid);
        border-color: var(--color-primary-solid);
        color: var(--color-on-primary);
        font-weight: 700;
      }

      [data-operation="acquire"]:hover:not(:disabled),
      [data-operation="accept"]:hover:not(:disabled),
      .triage-item .item-controls:not(:has([data-operation="accept"], [data-operation="acquire"], [data-operation="preview"])) [data-operation="open"]:hover:not(:disabled),
      #confirm-submit:hover:not(:disabled),
      .item-controls:has([data-operation="accept"]:disabled) [data-operation="preview"]:hover:not(:disabled) {
        background: var(--color-primary-solid-hover);
        border-color: var(--color-primary-solid-hover);
      }

      /* Dismiss/reject are the quiet, discarding actions: ghost by default,
         danger-tinted on hover. The advancing action (accept/acquire/open)
         carries the solid primary weight instead. */
      .triage-item [data-operation="dismiss"],
      .triage-item [data-operation="reject"] {
        background: transparent;
        border-color: transparent;
        color: var(--color-muted);
      }
      .triage-item[data-working="true"] .item-controls [data-operation="open"] {
        background: transparent;
        border-color: transparent;
        color: var(--color-muted);
        font-weight: 500;
      }

      .triage-item [data-operation="dismiss"]:hover:not(:disabled),
      .triage-item [data-operation="reject"]:hover:not(:disabled) {
        background: var(--color-danger-surface);
        border-color: var(--color-danger-border);
        color: var(--color-danger);
      }

      a {
        color: var(--color-primary);
        text-decoration-thickness: 1px;
        text-underline-offset: var(--space-1);
      }

      a:hover {
        color: var(--color-context);
      }

      #item-list,
      #watch-list {
        margin-top: var(--space-4);
      }

      .inbox-tabs {
        border-bottom: 1px solid var(--color-border);
        display: flex;
        gap: var(--space-1);
        margin-top: var(--space-4);
        overflow-x: auto;
      }

      .inbox-tab {
        background: transparent;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: var(--radius-control) var(--radius-control) 0 0;
        color: var(--color-muted);
        font-size: var(--font-size-small);
        font-weight: 700;
        min-height: var(--control-height);
        padding: var(--space-2) var(--space-3);
        white-space: nowrap;
      }

      .inbox-tab:hover:not(:disabled) {
        background: var(--color-surface-hover);
        color: var(--color-ink);
      }

      .inbox-tab[aria-selected="true"] {
        border-bottom-color: var(--color-primary-solid);
        color: var(--color-ink);
      }

      [role="tabpanel"] {
        min-width: 0;
      }

      #activity-panel {
        margin-top: var(--space-8);
      }

      #activity-panel > h2 {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      #activity-list {
        display: grid;
        gap: var(--space-4);
        margin-top: var(--space-4);
      }

      .activity-group {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        overflow: hidden;
      }

      .activity-group h3 {
        align-items: center;
        background: var(--color-surface-hover);
        display: flex;
        flex-wrap: wrap;
        font-size: var(--font-size-small);
        gap: var(--space-2);
        justify-content: space-between;
        padding: var(--space-2) var(--space-3);
      }

      .activity-group-list {
        display: grid;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .activity-entry {
        align-items: baseline;
        border-top: 1px solid var(--color-border);
        display: grid;
        gap: var(--space-2);
        grid-template-columns: max-content minmax(0, 1fr) max-content;
        padding: var(--space-2) var(--space-3);
      }

      .activity-time {
        color: var(--color-muted);
        font-size: var(--font-size-label);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .activity-text {
        overflow-wrap: anywhere;
      }

      .activity-count {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .activity-job-chip {
        background: var(--color-neutral-badge);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-pill);
        color: var(--color-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--font-size-label);
        font-weight: 500;
        letter-spacing: 0.04em;
        min-height: 0;
        overflow: hidden;
        padding: 1px var(--space-2);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button.activity-job-link {
        color: var(--color-primary);
        cursor: pointer;
      }
      .activity-new {
        color: var(--color-primary);
        font-size: var(--font-size-small);
        margin-top: var(--space-3);
      }

      #activity-show-more {
        margin-top: var(--space-3);
      }

      .activity-live-status {
        background: var(--color-primary-surface);
        border: 1px solid var(--color-primary-border);
        border-radius: var(--radius-pill);
        color: var(--color-primary);
        display: inline-block;
        font-size: var(--font-size-label);
        font-weight: 700;
        margin-top: var(--space-1);
        padding: 0 var(--space-2);
        width: fit-content;
      }

      .activity-highlight {
        background: var(--color-primary-hover);
        box-shadow: inset 0 0 0 var(--focus-width) var(--color-primary);
      }

      .triage-group {
        margin-bottom: var(--space-6);
      }

      .triage-group > h2 {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        font-weight: 700;
        letter-spacing: 0.07em;
        padding-left: var(--space-1);
        text-transform: uppercase;
      }


      .triage-group-retraction > h2 {
        color: var(--color-danger);
      }

      .triage-group > h2 {
        margin-bottom: var(--space-2);
      }

      /* Items render as one divided list per group: a shared surface with
         hairline separators, not individual outlined cards. */
      .triage-item {
        align-items: start;
        background: var(--color-surface);
        border-inline: 1px solid var(--color-border);
        display: grid;
        gap: var(--space-3);
        grid-template-columns: auto minmax(0, 1fr) auto;
        min-width: 0;
        padding: var(--space-3) var(--space-4);
        transition: background-color var(--motion-hover) var(--ease-out-quart);
      }

      /* Attention is expressed by the row's instruction and controls. It is
         turn-taking metadata, not a severity or visual decoration axis. */

      /* Card corners follow the family blocks the daemon emits, not tag position.
         `:first-of-type`/`:last-of-type` are scoped to element type, so once
         family headings interleave with rows they matched only the section's
         first and last <article> and every interior boundary rendered square. */

      .triage-group > .triage-item[data-card-start="true"] {
        border-top: 1px solid var(--color-border);
        border-top-left-radius: var(--radius-card);
        border-top-right-radius: var(--radius-card);
      }

      .triage-group > .triage-item[data-card-end="true"] {
        border-bottom: 1px solid var(--color-border);
        border-bottom-left-radius: var(--radius-card);
        border-bottom-right-radius: var(--radius-card);
      }

      .triage-item + .triage-item {
        border-top: 1px solid var(--color-border);
      }

      .triage-item:hover {
        background: var(--color-surface-hover);
      }

      .triage-item:focus {
        outline: var(--focus-width) solid var(--color-primary);
        outline-offset: calc(-1 * var(--focus-width));
      }

      .triage-item h3 {
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        color: var(--color-ink);
        display: -webkit-box;
        font-size: var(--font-size-item-title);
        font-weight: 600;
        line-height: 1.3;
        min-width: 0;
        overflow: hidden;
      }

      /* A row whose "title" is just the action kind or a bare identifier
         (the daemon had no bibliographic title) must not masquerade as a
         paper title. */
      .triage-item h3.title-placeholder {
        color: var(--color-muted);
        font-size: var(--font-size-body);
        font-style: italic;
        font-weight: 500;
      }

      .item-facts {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 0 var(--space-1);
        min-width: 0;
      }

      .item-facts dt {
        color: var(--color-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .item-facts dt:not(:first-child) {
        margin-left: var(--space-2);
      }

      .item-facts dd {
        color: var(--color-context);
        font-size: var(--font-size-small);
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .item-delivery {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 0 var(--space-1);
        min-width: 0;
      }

      .item-delivery dt {
        color: var(--color-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .item-delivery dt:not(:first-child) {
        margin-left: var(--space-2);
      }

      .item-delivery dd {
        color: var(--color-context);
        font-size: var(--font-size-small);
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .item-body {
        display: grid;
        gap: var(--space-1);
        min-width: 0;
      }

      /* The status column: one glyph per item kind/action kind, colored by
         urgency, with the human-readable meaning in the tooltip and the
         accessible name. Unknown kinds from a newer daemon fall back to a
         neutral dot rather than breaking the row. */
      .item-status {
        align-items: center;
        background: var(--color-neutral-badge);
        border: 1px solid var(--color-control-border);
        border-radius: 50%;
        color: var(--color-muted);
        display: flex;
        flex: none;
        font-size: var(--font-size-small);
        font-weight: 700;
        height: var(--row-control-size);
        justify-content: center;
        margin-top: 1px;
        position: relative;
        width: var(--row-control-size);
      }

      /* Instant tooltip for icon-only affordances (status glyphs, the
         backend-details disclosure): the meaning appears on hover without
         the native title delay. Screen readers get aria-label instead. */
      .triage-item .item-status::after,
      .triage-item .item-debug-toggle::after {
        background: var(--color-ink);
        border-radius: var(--radius-control);
        color: var(--color-page);
        content: attr(data-label);
        font-size: var(--font-size-label);
        font-weight: 600;
        left: 0;
        opacity: 0;
        padding: var(--space-1) var(--space-2);
        pointer-events: none;
        position: absolute;
        top: calc(100% + var(--space-1));
        transition: opacity var(--motion-hover);
        white-space: nowrap;
        z-index: 1;
      }

      .triage-item .item-status:hover::after,
      .triage-item:focus-visible > .item-status::after,
      .triage-item .item-debug-toggle:hover::after,
      .triage-item .item-debug-toggle:focus-visible::after {
        opacity: 1;
      }

      .item-status[data-tone="actionable"] {
        background: var(--color-primary-surface);
        border-color: var(--color-primary-border);
        color: var(--color-primary);
      }

      .item-status[data-tone="continuing"] {
        background: var(--color-neutral-badge);
        border-color: var(--color-control-border);
        color: var(--color-context);
      }

      .item-status[data-tone="degraded"] {
        background: var(--color-warning-surface);
        border-color: var(--color-warning-border);
        color: var(--color-warning);
      }

      .item-status[data-tone="danger"] {
        background: var(--color-danger-surface);
        border-color: var(--color-danger-border);
      }

      .item-status[data-tone="neutral"] {
        background: var(--color-neutral-badge);
        border-color: var(--color-control-border);
        color: var(--color-muted);
      }


      /* Bibliographic metadata and next-action copy stay quiet; supporting
         mechanism text is available from the inline disclosure. */
      .item-citation {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      .item-instruction {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .family-heading {
        margin-top: var(--space-6);
      }

      .family-guidance {
        margin: var(--space-2) 0 var(--space-3);
      }

      /* Printed only where papio cannot take the download itself, so it sits
         with the hoisted instruction rather than repeating on every row. */
      .family-mechanism {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        margin: calc(-1 * var(--space-2)) 0 var(--space-3);
      }

      .item-guidance {
        color: var(--color-muted);
        font-size: var(--font-size-small);
      }

      /* One line, and only where this row's reason differs from its family's.
         It sits under the hoisted instruction, quieter than the title and
         never wider than the card. */
      .item-reason {
        color: var(--color-muted);
        font-size: var(--font-size-small);
      }

      /* This remains a real button for keyboard users, but reads as an
         inline active chevron rather than a second control in the row. */
      .item-debug-toggle {
        align-items: center;
        appearance: none;
        background: transparent;
        border: 0;
        color: var(--color-primary);
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        height: var(--row-control-size);
        justify-content: center;
        line-height: 1;
        margin-inline-start: var(--space-1);
        min-height: var(--row-control-size);
        min-width: var(--row-control-size);
        padding: 0;
        position: relative;
        transition: none;
        vertical-align: middle;
        width: var(--row-control-size);
      }

      .item-debug-toggle svg {
        display: block;
        fill: none;
        height: 12px;
        width: 12px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
        width: 100%;
      }

      .item-debug-toggle:hover,
      .item-debug-toggle:focus-visible {
        background: transparent;
        border: 0;
        color: var(--color-primary-solid-hover);
      }

      @media (prefers-color-scheme: dark) {
        .item-debug-toggle:hover,
        .item-debug-toggle:focus-visible {
          color: #fff;
        }
      }

      .item-debug {
        color: var(--color-muted);
        display: grid;
        font-size: var(--font-size-label);
        gap: var(--space-2);
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
      }

      .item-debug-field {
        min-width: 0;
      }

      .item-debug dt {
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .item-debug dd {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-mechanism {
        grid-column: 1 / -1;
      }

      .item-mechanism dd {
        font-family: inherit;
        overflow: visible;
        white-space: normal;
      }

      /* Long filesystem paths (quarantine files) collapse to one ellipsized
         code line; the full path lives in the tooltip. */
      .file-path {
        display: inline-block;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: var(--font-size-label);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        white-space: nowrap;
      }


      .triage-item > .item-controls {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        margin: 0;
      }

      .triage-item > .item-controls button {
        min-height: var(--row-control-size);
        min-width: var(--row-control-size);
        padding: var(--space-1) var(--space-2);
      }

      /* Success/guidance text stays the calm primary tone; a daemon-rejected
         change reads as a real error; a connectivity blip reads as transient
         (it clears itself once the auto-reconnect above succeeds). */
      .item-result {
        color: var(--color-primary);
        font-size: var(--font-size-small);
        font-weight: 600;
      }

      .item-result[data-tone="error"] {
        color: var(--color-danger);
      }

      .item-result[data-tone="offline"] {
        color: var(--color-warning);
      }

      #item-list > p {
        color: var(--color-muted);
        padding: var(--space-8) 0;
        text-align: center;
      }

      /* Screen-reader announcer only: operation feedback renders visibly on
       * the affected row (item-result); a visible global line went stale and
       * leaked across panels ("PDF opened" inside the Watch empty state). */
      #operation-status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }

      #load-more {
        margin-bottom: var(--space-6);
      }

      /* One feedback strip is shared by undoable dismissals and short-lived
         acknowledgements. It never owns a live region; #operation-status is
         the sole polite announcer. */
      #undo-bar {
        align-items: center;
        background: var(--color-surface);
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-card);
        bottom: var(--space-4);
        box-shadow: var(--shadow-feedback);
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        inset-inline: var(--space-4);
        margin-inline: auto;
        max-inline-size: min(32rem, calc(100vw - 32px));
        min-height: 44px;
        padding: 12px 12px 12px 16px;
        position: fixed;
        z-index: 2;
      }

      #undo-bar[data-kind="success"] {
        background: var(--color-ok-surface);
        border-color: var(--color-ok-border);
        color: var(--color-ok);
      }

      #undo-bar.is-enter {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity var(--motion-feedback-in) var(--ease-out-quart),
          transform var(--motion-feedback-in) var(--ease-out-quart);
      }

      #undo-bar.is-exit {
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition:
          opacity var(--motion-feedback-out) var(--ease-in-quart),
          transform var(--motion-feedback-out) var(--ease-in-quart);
      }

      #undo-message {
        flex: 1 1 auto;
        font-size: var(--font-size-small);
        min-width: 0;
      }

      #undo-dismiss {
        flex: 0 0 auto;
        min-height: var(--row-control-size);
        min-width: var(--row-control-size);
      }

      /* Keyboard help and generated-at stick to the viewport bottom until the
         list is scrolled to its end. */
      footer {
        align-items: baseline;
        background: var(--color-page);
        border-top: 1px solid var(--color-border);
        bottom: 0;
        color: var(--color-muted);
        display: flex;
        flex-wrap: wrap;
        font-size: var(--font-size-label);
        gap: var(--space-2) var(--space-4);
        justify-content: space-between;
        padding-block: var(--space-3);
        position: sticky;
        z-index: 1;
      }

      #shortcut-help {
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
      }

      #shortcut-help kbd {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        display: inline-block;
        font-family: inherit;
        font-size: var(--font-size-label);
        line-height: 1.4;
        min-width: 1.4em;
        padding: 0 var(--space-1);
        text-align: center;
      }

      #generated-at {
        overflow-wrap: anywhere;
        text-align: right;
      }

      #confirm-dialog {
        background: var(--color-overlay);
        inset: 0;
        padding: var(--space-4);
        place-items: center;
        position: fixed;
        z-index: 1;
      }

      #confirm-dialog:not([hidden]) {
        display: grid;
      }

      #confirm-dialog > section {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-dialog);
        color: var(--color-ink);
        display: grid;
        gap: var(--space-4);
        max-height: calc(100vh - (var(--space-4) * 2));
        max-width: var(--dialog-max-width);
        overflow: auto;
        padding: var(--space-6);
        width: min(var(--dialog-max-width), calc(100% - (var(--space-4) * 2)));
      }

      #confirm-dialog-title {
        color: var(--color-brand-ink);
        font-size: var(--font-size-item-title);
        line-height: 1.3;
      }


      @media (max-width: 44rem) {
        body {
          padding: var(--space-6) var(--space-4) 0;
        }

        header {
          grid-template-columns: minmax(0, 1fr);
        }

        .brand,
        #connection-status,
        #inbox-pulse,
        #inbox-counts,
        .toolbar {
          grid-column: 1;
          grid-row: auto;
        }

        #connection-status {
          justify-self: start;
        }

        .toolbar {
          flex-wrap: wrap;
          justify-content: flex-start;
        }

        .triage-item {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .triage-item > .item-controls {
          grid-column: 1 / -1;
          grid-row: auto;
          justify-self: start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          transform: none !important;
        }

        #undo-bar.is-enter,
        #undo-bar.is-exit {
          opacity: 1;
          transform: none;
        }
      }

    </style>
  </head>
  <body>
    <header>
      <h1 class="brand">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M 95.0 374.6 A 200 200 0 1 1 243.7 455.6" fill="none" stroke="var(--color-brand-ink)" stroke-width="46" stroke-linecap="round"/>
          <g transform="translate(264 244) skewX(-10)">
            <circle cx="0" cy="0" r="68" fill="none" stroke="var(--color-brand-accent)" stroke-width="42"/>
          </g>
          <path d="M 208.0 176.0 L 163.2 430.0" fill="none" stroke="var(--color-brand-accent)" stroke-width="42" stroke-linecap="round"/>
          <path d="M 115.7 416.0 L 215.7 416.0 L 152.6 490.0 Z" fill="var(--color-brand-accent)" stroke="var(--color-brand-accent)" stroke-width="10" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name"><em>papio</em> <span class="page-name">inbox</span></span>
      </h1>
      <p id="connection-status" role="status" aria-live="polite">Connecting to daemon…</p>
      <p id="inbox-pulse" role="status" aria-live="polite">Can't tell — live progress is unavailable</p>
      <p id="inbox-counts">Counts unavailable</p>
      <div class="toolbar" aria-label="Inbox controls">
        <input id="item-filter" type="search" placeholder="Filter by title, DOI, or detail…" aria-label="Filter inbox items" />
        <select id="citation-style" aria-label="Citation style">
          <option value="apa">APA</option>
          <option value="mla">MLA</option>
          <option value="chicago">Chicago</option>
        </select>
        <button id="refresh-inbox" type="button">Refresh</button>
        <button id="reconnect-daemon" type="button" hidden>Reconnect</button>
      </div>
    </header>
    <nav class="inbox-tabs" aria-label="Inbox views" role="tablist">
      <button id="actions-tab" class="inbox-tab" type="button" role="tab" aria-controls="actions-panel" aria-selected="true" data-tab="actions" tabindex="0">Actions (0)</button>
      <button id="watch-tab" class="inbox-tab" type="button" role="tab" aria-controls="watch-panel" aria-selected="false" data-tab="watch" tabindex="-1">Watch hits (0)</button>
      <button id="activity-tab" class="inbox-tab" type="button" role="tab" aria-controls="activity-panel" aria-selected="false" data-tab="activity" tabindex="-1" hidden>Activity</button>
    </nav>
    <section id="actions-panel" role="tabpanel" aria-labelledby="actions-tab">
      <main id="item-list" aria-label="Actions"></main>
    </section>
    <section id="watch-panel" role="tabpanel" aria-labelledby="watch-tab" hidden>
      <div id="watch-list" aria-label="Watch hits"></div>
    </section>
    <section id="activity-panel" role="tabpanel" aria-labelledby="activity-tab" hidden>
      <h2 id="activity-heading">Activity</h2>
      <div id="activity-new" class="activity-new" hidden></div>
      <div id="activity-list" role="log" aria-live="off"></div>
      <button id="activity-show-more" type="button" hidden>Show more</button>
    </section>
    <p id="operation-status" role="status" aria-live="polite"></p>
    <button id="load-more" type="button" hidden>Load more</button>
    <div id="undo-bar" hidden>
      <p id="undo-message"></p>
      <button id="undo-dismiss" type="button">Undo</button>
    </div>
    <footer>
      <p id="shortcut-help">
        <kbd>j</kbd>/<kbd>k</kbd> select · <kbd>a</kbd> act · <kbd>d</kbd> dismiss ·
        <kbd>u</kbd> undo · <kbd>o</kbd> open
      </p>
      <time id="generated-at">generated at —</time>
    </footer>
    <div id="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message" hidden>
      <section>
        <h2 id="confirm-dialog-title">Confirm change</h2>
        <p id="confirm-dialog-message"></p>
        <div class="item-controls">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-submit" type="button">Confirm</button>
        </div>
      </section>
    </div>
    <script src="./inbox.js" type="module"></script>
  </body>
</html>
