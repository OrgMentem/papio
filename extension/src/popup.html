<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>papio</title>
    <style>
      :root {
        color-scheme: light dark;
        --color-ink: #182231;
        --color-brand-ink: #2b2d42;
        --color-brand-accent: #d94f3d;
        --color-muted: #607080;
        --color-context: #426789;
        --color-border: #dce3ea;
        --color-control-border: #b8c5d1;
        --color-page: #f4f7f9;
        --color-surface: #fdfefe;
        --color-surface-hover: #eef3f6;
        --color-primary: #12549b;
        --color-primary-border: #8db9eb;
        --color-primary-surface: #eaf3ff;
        --color-primary-hover: #dcecff;
        --color-warning: #6d4316;
        --color-warning-border: #a15c17;
        --color-warning-surface: #fff7ed;
        --color-ok: #245e45;
        --color-ok-border: #78aa8f;
        --color-ok-surface: #edf7f1;
        --color-danger: #8f2f28;
        --color-danger-border: #d94f3d;
        --color-danger-surface: #fff0ed;
        --color-neutral-badge: #eef3f6;
        --color-primary-solid: #12549b;
        --color-primary-solid-hover: #0d447f;
        --color-on-primary: #fdfefe;
        --font-size-label: 11px;
        --font-size-small: 12px;
        --font-size-body: 14px;
        --font-size-title: 22px;
        --font-size-item-title: 16px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-control: 6px;
        --radius-card: 8px;
        --radius-pill: 999px;
        --control-height: 36px;
        /* Compact minimum block size for every popup control. The popup is a
           380px lens, so its actions stay 32px; the old 44px --action-height
           made one button dominate the surface it was meant to sit inside. */
        --control-height-compact: 32px;
        --inbox-row-height: 80px;
        --brand-mark-size: 32px;
        --settings-mark-size: 18px;
        --popup-width: 380px;
        --focus-width: 2px;
        --focus-offset: 2px;
        /* Motion is scoped by role, not by taste: hover tints controls, state
           moves locally initiated inline feedback, and feedback-in/out belongs
           only to the transient acknowledgements. Nothing polled animates. */
        --motion-hover: 120ms;
        --motion-state: 160ms;
        --motion-feedback-in: 180ms;
        --motion-feedback-out: 140ms;
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --ease-in-quart: cubic-bezier(0.5, 0, 0.75, 0);
        accent-color: var(--color-primary);
        color: var(--color-ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-ink: #e5edf4;
          --color-brand-ink: #f0edf3;
          --color-brand-accent: #ef6a57;
          --color-muted: #a2b1be;
          --color-context: #aecbe4;
          --color-border: #3e4f61;
          --color-control-border: #526579;
          --color-page: #141b23;
          --color-surface: #1c2631;
          --color-surface-hover: #263340;
          --color-primary: #a8d0ff;
          --color-primary-border: #4f85bc;
          --color-primary-surface: #183956;
          --color-primary-hover: #214967;
          --color-warning: #f1c183;
          --color-warning-border: #b97833;
          --color-warning-surface: #33291e;
          --color-ok: #b3ddc2;
          --color-ok-border: #568f6d;
          --color-ok-surface: #1d3329;
          --color-danger: #ffb2a8;
          --color-danger-border: #ef6a57;
          --color-danger-surface: #3a2223;
          --color-neutral-badge: #263340;
          --color-primary-solid: #75b5f5;
          --color-primary-solid-hover: #91c5fb;
          --color-on-primary: #101a24;
        }
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        background: var(--color-page);
      }

      body {
        background: var(--color-page);
        color: var(--color-ink);
        font-size: var(--font-size-body);
        line-height: 1.45;
        margin: 0;
        max-width: 100vw;
        min-width: 320px;
        padding: var(--space-3);
        width: min(var(--popup-width), 100vw);
      }

      header {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin-bottom: var(--space-2);
      }

      h2,
      p {
        margin: 0;
      }

      h2 {
        color: var(--color-brand-ink);
        font-size: var(--font-size-body);
        font-weight: 700;
        line-height: 1.3;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: var(--space-3);
      }

      .brand svg {
        flex: none;
        height: var(--brand-mark-size);
        width: var(--brand-mark-size);
      }

      .brand-name {
        color: var(--color-brand-ink);
        font-size: var(--font-size-title);
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }

      .brand-name em {
        text-decoration-color: var(--color-brand-accent);
        text-decoration-line: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: var(--space-1);
      }

      button,
      select,
      summary {
        font: inherit;
      }

      button {
        appearance: none;
        background: var(--color-surface);
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        cursor: pointer;
        font-size: var(--font-size-small);
        min-height: var(--control-height-compact);
        padding: var(--space-1) var(--space-3);
        white-space: nowrap;
        transition:
          background-color var(--motion-hover) var(--ease-out-quart),
          border-color var(--motion-hover) var(--ease-out-quart),
          color var(--motion-hover) var(--ease-out-quart);
      }

      button:hover:not(:disabled) {
        background: var(--color-surface-hover);
      }

      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: var(--focus-width) solid var(--color-primary);
        outline-offset: var(--focus-offset);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .settings-btn {
        align-items: center;
        background: var(--color-surface);
        border-color: var(--color-border);
        border-radius: var(--radius-pill);
        color: var(--color-muted);
        display: inline-flex;
        flex: none;
        justify-content: center;
        padding: 0;
        min-height: var(--control-height-compact);
        width: var(--control-height-compact);
      }

      .settings-btn:hover:not(:disabled) {
        border-color: var(--color-control-border);
        color: var(--color-ink);
      }

      .settings-btn svg {
        display: block;
        height: var(--settings-mark-size);
        width: var(--settings-mark-size);
      }

      main {
        display: grid;
        gap: var(--space-2);
      }

      .daemon-status {
        background: var(--color-warning-surface);
        border: 1px solid var(--color-warning-border);
        border-radius: var(--radius-card);
        color: var(--color-warning);
        display: grid;
        font-size: var(--font-size-small);
        gap: var(--space-1);
        margin-bottom: var(--space-3);
        padding: var(--space-3);
      }

      .daemon-status-message {
        font-weight: 700;
      }

      .daemon-status-hint {
        overflow-wrap: anywhere;
      }
      .popup-pulse {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        display: grid;
        gap: var(--space-1);
        margin-bottom: var(--space-2);
        min-width: 0;
        padding: var(--space-3);
      }

      .popup-pulse-primary {
        font-weight: 700;
      }

      .popup-pulse-detail {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      .launcher {
        display: grid;
        gap: var(--space-2);
      }

      .launcher-action {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        display: grid;
        gap: var(--space-2);
        min-width: 0;
        padding: var(--space-3);
      }

      /* One rail owns every current-page action, so Acquire/Send PDF and bulk
         selection are read as siblings instead of one living in the brand
         header and one in a card further down. */
      .current-page-actions {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        display: grid;
        gap: var(--space-2);
        min-width: 0;
        padding: var(--space-3);
      }

      /* Collapsed entirely when the rail owns nothing: an empty grid cell would
         still contribute its gap and leave a visible sliver of card. */
      .current-page-actions[hidden] {
        display: none;
      }

      .current-page-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      /* Grow to share the row, but never below the label's own width: equal
         flex growth used to divide the 356px content box evenly and clip
         "Select papers on this page" while the short Acquire button sat in
         unused space. When both labels cannot fit, the row wraps instead of
         truncating either one. */
      .current-page-controls > button {
        flex: 1 1 auto;
        min-width: max-content;
      }

      .current-page-controls > button[hidden] {
        display: none;
      }

      .page-acquire-feedback {
        display: grid;
        gap: var(--space-2);
        min-width: 0;
      }

      /* ADR-0019 Decision 2's consent decision, inline and local: it is a
         researcher action, so it is primary-toned, and it never looks like an
         error even though it blocks the scan. */
      .page-consent {
        border: 1px solid var(--color-primary-border);
        border-radius: var(--radius-control);
        background: var(--color-primary-surface);
        display: grid;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
      }

      .page-consent-message {
        color: var(--color-primary);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      .page-consent-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      .page-consent-controls > button {
        flex: 1 1 auto;
        min-width: max-content;
      }

      .page-acquire-live {
        display: grid;
        gap: var(--space-2);
      }

      .page-acquire-live-title {
        color: var(--color-ink);
        display: -webkit-box;
        font-size: var(--font-size-body);
        font-weight: 700;
        overflow: hidden;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .page-acquire-live-status {
        color: var(--color-context);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      .page-acquire-live-status[data-stalled="true"] {
        color: var(--color-warning);
        font-weight: 700;
      }

      .page-acquire-live-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      .page-acquire-live-controls button {
        flex: 1 1 8rem;
      }

      /* Every popup-local result has one geometry and one semantic border, so
         a queue acceptance, a refusal, and a transport failure differ by
         meaning rather than by shape. Hidden means zero height: no reserved
         pixels while empty. */
      .popup-result {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
        padding: var(--space-2) var(--space-3);
        transition:
          background-color var(--motion-state) var(--ease-out-quart),
          border-color var(--motion-state) var(--ease-out-quart),
          color var(--motion-state) var(--ease-out-quart);
        width: 100%;
      }

      .popup-result:empty,
      .popup-result[hidden] {
        display: none;
      }

      .popup-result[data-tone="progress"] {
        background: var(--color-neutral-badge);
        border-color: var(--color-border);
        color: var(--color-context);
      }

      .popup-result[data-tone="success"] {
        background: var(--color-ok-surface);
        border-color: var(--color-ok-border);
        color: var(--color-ok);
      }

      .popup-result[data-tone="info"] {
        background: var(--color-primary-surface);
        border-color: var(--color-primary-border);
        color: var(--color-primary);
      }

      .popup-result[data-tone="degraded"] {
        background: var(--color-warning-surface);
        border-color: var(--color-warning-border);
        color: var(--color-warning);
      }

      .popup-result[data-tone="error"] {
        background: var(--color-danger-surface);
        border-color: var(--color-danger-border);
        color: var(--color-danger);
      }

      /* The stable operation announcer carries no pixels; it exists so a state
         transition is spoken exactly once without every local result element
         becoming its own live region. */
      .visually-hidden {
        border: 0;
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      .capture-status {
        color: var(--color-context);
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .capture-status:empty {
        display: none;
      }


      button.primary {
        background: var(--color-primary-solid);
        border-color: var(--color-primary-solid);
        color: var(--color-on-primary);
        font-weight: 700;
      }

      button.primary:hover:not(:disabled) {
        background: var(--color-primary-solid-hover);
        border-color: var(--color-primary-solid-hover);
      }

      button.primary:disabled {
        background: var(--color-surface-hover);
        border-color: var(--color-control-border);
        color: var(--color-muted);
        opacity: 1;
      }
      
      button.ghost {
        background: transparent;
        border-color: var(--color-control-border);
        color: var(--color-primary);
        font-weight: 700;
      }

      button.ghost:hover:not(:disabled) {
        background: var(--color-surface-hover);
      }

      .header-actions {
        display: flex;
        flex: none;
        gap: var(--space-1);
      }


      .resolver-grant,
      .terms-consent,
      .needs-you {
        border: 1px solid var(--color-primary-border);
        border-radius: var(--radius-card);
        display: grid;
        gap: var(--space-2);
        padding: var(--space-3);
      }

      .institution-session {
        color: var(--color-ink);
      }

      .institution-session h2 {
        color: var(--color-brand-ink);
      }

      .institution-session-header {
        align-items: baseline;
        display: flex;
        gap: var(--space-2);
        justify-content: space-between;
      }

      .institution-session-status {
        color: var(--color-context);
        font-weight: 700;
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .institution-session-origin,
      .institution-session-unblocked {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      /* One convention for a single-action row: text left, compact button
       * right — never a full-width button under a description. */
      .action-row {
        align-items: center;
        display: flex;
        gap: var(--space-2);
        justify-content: space-between;
      }

      .action-row > button {
        flex: none;
        min-height: var(--control-height);
        padding: 0 var(--space-3);
        width: auto;
      }

      .institution-session-rows {
        display: grid;
        gap: var(--space-2);
      }

      .institution-session-origin-row {
        border-top: 1px solid var(--color-border);
        padding-top: var(--space-2);
      }

      .institution-session-origin-copy {
        display: grid;
        gap: var(--space-1);
        min-width: 0;
      }
      .institution-session-waiting {
        border-top: 1px solid var(--color-border);
        display: grid;
        gap: var(--space-2);
        padding-top: var(--space-2);
      }

      .institution-session-waiting-heading {
        color: var(--color-muted);
        font-size: var(--font-size-label);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .institution-session-waiting-list {
        display: grid;
        gap: var(--space-2);
      }

      .institution-session-waiting-title {
        display: -webkit-box;
        font-size: var(--font-size-small);
        font-weight: 600;
        min-width: 0;
        overflow: hidden;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .institution-session-waiting-status {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      .institution-session-unblocked {
        border-top: 1px solid var(--color-border);
        padding-top: var(--space-2);
        transition: opacity 220ms ease-out;
      }

      .institution-session-unblocked.is-expiring {
        opacity: 0;
      }

      .leftover-tabs-message {
        color: var(--color-muted);
        font-size: var(--font-size-small);
      }

      .resolver-grant {
        background: var(--color-primary-surface);
        color: var(--color-context);
      }

      .resolver-grant > p,
      .terms-consent > p {
        font-size: var(--font-size-small);
      }
      /* No full-width 44px exception: a grant is one ordinary researcher
         control, and wrapping at 320px keeps it from becoming the largest
         object in a 380px lens. */
      .resolver-grant-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      .resolver-grant-controls > button {
        flex: 1 1 auto;
        min-width: max-content;
      }


      /* Terms acceptance and the Needs-you blockers are decisions waiting on
         the researcher, not warnings about papio's health, so they carry the
         actionable palette. Amber stays for degradation, red for integrity. */
      .terms-consent {
        background: var(--color-primary-surface);
        border-color: var(--color-primary-border);
        color: var(--color-primary);
      }

      .terms-consent h2 {
        color: var(--color-primary);
      }

      .terms-consent-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-top: var(--space-1);
      }

      .terms-consent-controls button {
        flex: 1 1 auto;
        min-width: max-content;
        padding-inline: var(--space-2);
      }

      .needs-you {
        background: var(--color-primary-surface);
        border-color: var(--color-primary-border);
        color: var(--color-primary);
      }

      .needs-you h2 {
        color: var(--color-primary);
      }

      .needs-you > p {
        font-size: var(--font-size-small);
      }

      .needs-you-list {
        display: grid;
        gap: var(--space-2);
      }

      .needs-you-item {
        align-items: center;
        border-top: 1px solid var(--color-primary-border);
        display: grid;
        gap: var(--space-2);
        grid-template-columns: minmax(0, 1fr) auto;
        padding-top: var(--space-2);
      }

      .needs-you-paper {
        font-size: var(--font-size-small);
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .needs-you-copy {
        display: grid;
        gap: var(--space-1);
        min-width: 0;
      }

      .needs-you-reason {
        color: var(--color-primary);
        font-size: var(--font-size-small);
        overflow-wrap: anywhere;
      }

      .needs-you-item > button {
        border-color: var(--color-primary-border);
        color: var(--color-primary);
        font-weight: 700;
      }

      .needs-you-item > button:hover:not(:disabled) {
        background: var(--color-surface-hover);
      }

      .capture {
        border-top: 1px solid var(--color-border);
        color: var(--color-muted);
        font-size: var(--font-size-small);
        margin-top: var(--space-1);
        padding-top: var(--space-2);
      }

      .capture summary {
        border-radius: var(--radius-control);
        cursor: pointer;
        min-height: var(--control-height);
        padding: var(--space-2);
      }

      .capture summary:hover {
        background: var(--color-surface-hover);
        color: var(--color-ink);
      }

      .capture-body {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        display: grid;
        gap: var(--space-2);
        margin-top: var(--space-2);
        padding: var(--space-3);
      }

      .capture .row {
        display: grid;
        gap: var(--space-2);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .capture select {
        background: var(--color-surface);
        border: 1px solid var(--color-control-border);
        border-radius: var(--radius-control);
        color: var(--color-ink);
        min-height: var(--control-height);
        min-width: 0;
        padding: var(--space-1) var(--space-2);
        width: 100%;
      }

      .capture button {
        justify-self: start;
      }

      /* One measured line, not a metric grid. papio counts; it never estimates
         time saved, an ETA, or acquisition progress. */
      .impact {
        align-items: baseline;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        justify-content: space-between;
        padding: var(--space-2) var(--space-3);
      }

      .impact-line {
        color: var(--color-muted);
        font-size: var(--font-size-small);
        font-variant-numeric: tabular-nums;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .impact-line > strong {
        color: var(--color-brand-ink);
      }

      #view-history-btn {
        background: transparent;
        border-color: transparent;
        color: var(--color-primary);
        font-weight: 600;
        min-height: 0;
        padding: 0;
      }

      #view-history-btn:hover:not(:disabled) {
        background: transparent;
        color: var(--color-primary-solid-hover);
        text-decoration: underline;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          transition-delay: 0ms !important;
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
        }

        /* Every translation is removed rather than merely shortened: a 0.01ms
           transform still lands the element in its animated position for one
           frame, which is exactly the motion this preference refuses. */
        .institution-session-unblocked,
        .popup-result {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M 95.0 374.6 A 200 200 0 1 1 243.7 455.6" fill="none" stroke="var(--color-brand-ink)" stroke-width="46" stroke-linecap="round"/>
          <g transform="translate(264 244) skewX(-10)">
            <circle cx="0" cy="0" r="68" fill="none" stroke="var(--color-brand-accent)" stroke-width="42"/>
          </g>
          <path d="M 208.0 176.0 L 163.2 430.0" fill="none" stroke="var(--color-brand-accent)" stroke-width="42" stroke-linecap="round"/>
          <path d="M 115.7 416.0 L 215.7 416.0 L 152.6 490.0 Z" fill="var(--color-brand-accent)" stroke="var(--color-brand-accent)" stroke-width="10" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name"><em>papio</em></span>
      </div>
      <div class="header-actions">
        <button id="open-inbox-btn" class="settings-btn" type="button" title="Open inbox" aria-label="Open inbox" aria-describedby="open-inbox-status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
        </button>
        <button id="settings-btn" class="settings-btn" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/>
          </svg>
        </button>
      </div>
    </header>
    <div id="daemon-status" class="daemon-status" role="status" aria-live="polite" hidden>
      <div id="daemon-status-message" class="daemon-status-message"></div>
      <div id="daemon-status-hint" class="daemon-status-hint"></div>
    </div>
    <div id="open-inbox-status" class="capture-status"></div>
    <!-- Hidden and empty until renderWorkPulse has real state: a default line
         here is painted before the first read returns, so every popup opened
         with a flash of a status nobody had measured yet. -->
    <section id="popup-pulse" class="popup-pulse" aria-labelledby="popup-pulse-primary" hidden>
      <div id="popup-pulse-primary" class="popup-pulse-primary" role="status" aria-live="polite"></div>
      <div id="popup-pulse-next" class="popup-pulse-detail" hidden></div>
      <div id="popup-pulse-capacity" class="popup-pulse-detail" hidden></div>
      <div id="popup-pulse-batch" class="popup-pulse-detail" hidden></div>
    </section>
    <main>
      <!-- One stable announcer for locally initiated operations. Local result
           elements below stay visible beside their controls but carry no live
           role, so an ordinary five-second refresh cannot re-speak state the
           researcher already heard. The daemon band and pulse keep their own
           separate liveness. -->
      <p id="popup-operation-status" class="visually-hidden" role="status" aria-live="polite"></p>

      <!-- The current-page rail: the popup's reason to exist. Both actions are
           siblings here so neither hides in the brand header, and the blocker
           groups below it are capped so none of them can push it off screen. -->
      <section id="current-page-actions" class="current-page-actions" aria-label="This page" hidden>
        <div class="current-page-controls">
          <button
            id="page-acquire-btn"
            class="primary"
            type="button"
            title="Acquire this page"
            aria-label="Acquire this page"
            aria-describedby="page-acquire-status"
            aria-disabled="true"
            disabled
            hidden
          >Acquire</button>
          <button
            id="page-bulk-scan-btn"
            class="ghost"
            type="button"
            aria-describedby="page-bulk-scan-status"
            hidden
          >Select papers on this page</button>
        </div>
        <div id="page-bulk-consent" class="page-consent" hidden>
          <p id="page-bulk-consent-message" class="page-consent-message"></p>
          <div class="page-consent-controls">
            <button id="page-bulk-consent-allow" class="primary" type="button" aria-describedby="page-bulk-consent-message">Allow and scan</button>
            <button id="page-bulk-consent-cancel" type="button">Cancel</button>
          </div>
        </div>
        <p id="page-bulk-scan-status" class="popup-result" hidden></p>
        <div id="page-acquire" class="page-acquire-feedback" hidden>
          <div id="page-acquire-status" class="popup-result" hidden></div>
          <div id="page-acquire-live" class="page-acquire-live" hidden>
            <p id="page-acquire-live-title" class="page-acquire-live-title" hidden></p>
            <p id="page-acquire-live-status" class="page-acquire-live-status"></p>
            <div class="page-acquire-live-controls">
              <button id="page-acquire-open-inbox" class="ghost" type="button">Open inbox item</button>
              <button id="page-acquire-go-tab" class="ghost" type="button" hidden>Open tab</button>
            </div>
          </div>
        </div>
      </section>

      <section id="needs-you-section" class="needs-you" hidden aria-labelledby="needs-you-heading">
        <h2 id="needs-you-heading">Needs you</h2>
        <p id="needs-you-message"></p>
        <div id="needs-you-list" class="needs-you-list"></div>
      </section>

      <section id="institution-session" class="launcher-action institution-session" hidden aria-labelledby="institution-session-heading">
        <div class="institution-session-header">
          <h2 id="institution-session-heading">Institution session</h2>
          <span id="institution-session-origin" class="institution-session-origin"></span>
        </div>
        <div class="action-row institution-session-row">
          <p id="institution-session-status" class="institution-session-status"></p>
          <button id="institution-session-signin" class="primary" type="button" aria-describedby="institution-session-status">Sign in</button>
        </div>
        <div id="institution-session-rows" class="institution-session-rows" hidden></div>
        <div id="institution-session-waiting" class="institution-session-waiting" hidden>
          <p id="institution-session-waiting-heading" class="institution-session-waiting-heading">Waiting on your sign-in</p>
          <div id="institution-session-waiting-list" class="institution-session-waiting-list"></div>
        </div>
        <!-- Keeps its own live role: this announces a daemon-side release the
             researcher did not initiate, so the local operation announcer is not
             its owner. -->
        <div id="institution-session-unblocked" class="institution-session-unblocked" role="status" aria-live="polite" hidden></div>
      </section>

      <section id="leftover-tabs" class="launcher-action leftover-tabs" hidden aria-labelledby="leftover-tabs-heading">
        <h2 id="leftover-tabs-heading">Leftover papio tabs</h2>
        <div class="action-row">
          <p id="leftover-tabs-message" class="leftover-tabs-message"></p>
          <button id="leftover-tabs-cleanup" type="button">Close them</button>
        </div>
      </section>

      <section id="popup-catchup" class="popup-pulse" hidden aria-label="While you were away">
        <div id="popup-catchup-text" class="popup-pulse-detail"></div>
        <button id="popup-catchup-open" class="ghost" type="button">Open inbox</button>
      </section>

      <section id="resolver-grant" class="resolver-grant" hidden></section>

      <section id="terms-consent" class="terms-consent" hidden>
        <h2>Publisher terms &amp; conditions</h2>
        <p>
          This publisher requires terms acceptance. Let <em>papio</em> accept future
          publisher terms for you? You can change this in Settings.
        </p>
        <div class="terms-consent-controls">
          <button id="terms-consent-enable" class="primary" type="button">Auto-accept terms</button>
          <button id="terms-consent-decline" type="button">I'll accept manually</button>
        </div>
      </section>

      <section id="impact-summary" class="impact" hidden aria-label="Your papio impact">
        <p class="impact-line"><strong id="impact-acquired">—</strong> acquired · <strong id="impact-success-rate">—</strong> success</p>
        <button id="view-history-btn" type="button">View history</button>
      </section>

      <details class="capture" hidden>
        <summary>Capture fixture (dev)</summary>
        <div class="capture-body">
          <div class="row">
            <select id="capture-provider" aria-label="Provider"></select>
            <select id="capture-scenario" aria-label="Scenario"></select>
          </div>
          <button id="capture-btn" type="button">Capture active tab</button>
          <div id="capture-status" class="capture-status" aria-live="polite"></div>
        </div>
      </details>
    </main>

    <script src="./popup.js" type="module"></script>
  </body>
</html>
