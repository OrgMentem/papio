name: extension-submit

# Automated browser-store submission for the MV3 extension.
#
# The extension is versioned and released independently of the daemon (v*)
# tags — it carries its own version in extension/manifest.json and is only
# resubmitted when it changes. Trigger this by pushing an `ext-v<version>` tag
# that matches manifest.json, or run it manually from the Actions tab.
#
# The `store-submit` GitHub Environment carries the deployment record and the
# ref policies (branch `main`, tag `ext-v*`); the store credentials are org and
# repo secrets, visible to the job without being environment secrets:
#   Chrome Web Store: CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID, CWS_PUBLISHER_ID
#   Firefox AMO:      WEB_EXT_API_KEY, WEB_EXT_API_SECRET
#
# Authorization is the trigger itself, not a reviewer prompt: pushing an
# `ext-v*` tag is the deliberate act, and it submits the version for review on
# BOTH stores — CWS and AMO each auto-publish once their review passes.
#
# A manual dispatch is the staging path, and its defaults are the least
# committal action each store offers: Chrome uploads a DRAFT (reversible;
# `chrome_publish=true` submits it for review), and AMO does nothing unless
# `firefox=true`, because an AMO submission permanently consumes the version
# number and reaches every installed user once review passes.
#
# First-time only: the Chrome Web Store item must be created by hand once (the
# API cannot create the initial listing); afterward this drives version updates.

on:
  push:
    tags:
      - 'ext-v*'
  workflow_dispatch:
    inputs:
      chrome:
        description: 'Chrome: upload to the Web Store'
        type: boolean
        default: true
      chrome_publish:
        description: 'Chrome: also submit for review, auto-live on approval (tag pushes always do)'
        type: boolean
        default: false
      firefox:
        description: 'Firefox: sign + submit the listed version to AMO (irreversible — burns the version number)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: extension-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: store-submit
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#ext-v}"
          manifest="$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "extension/manifest.json version ($manifest) does not match tag ($tag)" >&2
            exit 1
          fi
      - name: Build and lint bundles
        run: bun run lint:firefox
      - name: Submit to Chrome Web Store
        if: github.event_name == 'push' || github.event.inputs.chrome == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          # A tag is the release act, so it submits for review on BOTH stores —
          # otherwise the Chrome half stops at a draft nobody clicks while AMO
          # goes all the way (how 0.6.0 sat unpublished for a day). A manual
          # dispatch still defaults to a draft.
          CHROME_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/ext-v') || github.event.inputs.chrome_publish == 'true' }}
        run: |
          set -euo pipefail
          if [ "$CHROME_PUBLISH" = "true" ]; then
            bun run submit:chrome --publish
          else
            bun run submit:chrome
          fi
      - name: Submit to Firefox AMO
        if: github.event_name == 'push' || github.event.inputs.firefox == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: bun run submit:firefox listed
      - name: Upload store artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-store-artifacts
          path: extension/web-ext-artifacts/
          if-no-files-found: ignore
