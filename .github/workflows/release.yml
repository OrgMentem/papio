# CI-recorded, cosign-signed releases.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Windows-only suites (named-pipe DACL, privacy ACLs, native-host rollback)
  # never compile on the ubuntu gate below. Tags are pushed manually, so the
  # release job must wait for these suites on a real Windows host too.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      - name: Test Windows-only suites
        run: go test ./internal/ipc ./internal/doctor ./internal/nativehost ./internal/incident ./internal/config ./internal/app ./internal/cli

  release:
    needs: [test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
      # candidate_gate_test.go fails closed without pdftotext: its sentinels
      # are the suite's only contact with real extraction. ci.yml installs
      # poppler for the same reason; the release gate must too, or every tag
      # fails at Test (v0.22.0's first run did).
      - name: Install poppler (pdftotext)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      # Release gate: nothing enforces that the tagged commit passed CI (tags
      # are pushed manually), so refuse to ship artifacts from untested code.
      - name: Test
        run: go test ./...
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      # Fail the release if the built binary doesn't report the tag version —
      # catches a dropped/renamed -X ldflag before artifacts ship. Snapshot
      # single-target build is cheap and runs before the real release build
      # (its snapshot version embeds the base tag, so the grep below holds).
      - name: Build snapshot for version smoke test
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: build --snapshot --clean --single-target
      - name: Smoke-test version stamp
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          papio_bin="$(find dist -type f -name papio -path '*linux*')"
          "$papio_bin" version | tee /dev/stderr | grep -F "$tag"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
